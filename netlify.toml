# Netlify build configuration — law.pro.vn
# Next.js 16 (App Router) + Payload v3 admin embedded.
# The official @netlify/plugin-nextjs handles middleware, server actions,
# image optimisation, and ISR — no manual function wiring required.

[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "22"

# Cache the next-build artefacts between deploys so subsequent builds are faster.
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true
